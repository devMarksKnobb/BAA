name: Feature request
description: Suggest a capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What migration problem or workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the outcome you want, without requiring a specific implementation.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Data integrity and compatibility
      description: Mention preservation, conflicts, deletion behavior, or compatibility concerns.
    validations:
      required: false
